    <style>
        :root {
            --paypay-red: #ff5a60;
            --paypay-blue: #3b99fc;

            --bg-color: #f4f6f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        h1 {
            font-size: 20px;
            color: var(--paypay-red);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--paypay-red);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--paypay-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .output-section {
            margin-top: 24px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
        }

        .link-container {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-preview {
            background-color: var(--paypay-blue);
            flex: 1;
        }

        .btn-download {
            background-color: var(--paypay-green);
            flex: 1;
        }

        .btn-copy {
            background-color: #333;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            background: #fafafa;
            outline: none;
            margin-top: 8px;
        }

        .success-msg {
            color: var(--paypay-green);
            font-size: 13px;
            text-align: center;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
