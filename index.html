<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayPay風ページ ジェネレーター</title>
    <style>
        :root {
            --paypay-red: #ff5a60;
            --paypay-blue: #3b99fc;
            --paypay-green: #2e7d32;
            --bg-color: #f4f6f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        h1 {
            font-size: 20px;
            color: var(--paypay-red);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--paypay-red);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--paypay-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .output-section {
            margin-top: 24px;
            border-top: 2px dashed #eee;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-preview {
            background-color: var(--paypay-blue);
        }

        .btn-download {
            background-color: var(--paypay-green);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>PayPay風ページ ジェネレーター</h1>
        
        <div class="form-group">
            <label for="senderName">送信者名</label>
            <input type="text" id="senderName" value="たまねぎさん" placeholder="例: たまねぎさん">
        </div>

        <div class="form-group">
            <label for="amount">金額 (円)</label>
            <input type="number" id="amount" value="2500" placeholder="例: 2500">
        </div>

        <div class="form-group">
            <label for="placeId">Roblox Place ID</label>
            <input type="text" id="placeId" value="96342491571673" placeholder="例: 96342491571673">
        </div>

        <button class="btn" onclick="generatePage()">リンクを生成する</button>

        <div class="output-section">
            <a id="previewLink" href="#" target="_blank" class="btn btn-preview">生成したページを開く（プレビュー）</a>
            <a id="downloadLink" href="#" download="paypay_receive.html" class="btn btn-download">HTMLファイルをダウンロードする</a>
        </div>
    </div>

    <script>
        let currentBlobUrl = null;

        function generatePage() {
            const sender = document.getElementById('senderName').value || 'たまねぎさん';
            const rawAmount = document.getElementById('amount').value || '2500';
            const amount = Number(rawAmount).toLocaleString();
            const placeId = document.getElementById('placeId').value || '96342491571673';

            // 現在日時
            const now = new Date();
            const sendYear = now.getFullYear();
            const sendMonth = now.getMonth() + 1;
            const sendDate = now.getDate();
            const sendHour = now.getHours();
            const sendMin = now.getMinutes();

            const sendDateTimeStr = sendYear + '年' + sendMonth + '月' + sendDate + '日 ' + sendHour + '時' + sendMin + '分';
            const sendDateOnlyStr = sendYear + '年' + sendMonth + '月' + sendDate + '日';

            // 4日後
            const expireDateObj = new Date(now.getTime() + (4 * 24 * 60 * 60 * 1000));
            const expYear = expireDateObj.getFullYear();
            const expMonth = expireDateObj.getMonth() + 1;
            const expDate = expireDateObj.getDate();

            const expireDateTimeStr = expYear + '年' + expMonth + '月' + expDate + '日 ' + sendHour + '時' + sendMin + '分';
            const expireDateOnlyStr = expYear + '年' + expMonth + '月' + expDate + '日';

            // 決済番号ランダム
            let payId = '';
            for(let i=0; i<20; i++) {
                payId += Math.floor(Math.random() * 10);
            }

            // HTMLを安全に構築
            const htmlTemplate = '<!DOCTYPE html>\n' +
'<html lang="ja">\n' +
'<head>\n' +
'    <meta charset="UTF-8">\n' +
'    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n' +
'    <title>PayPay - 受け取り</title>\n' +
'    <meta property="og:title" content="PayPay - 受け取り">\n' +
'    <meta property="og:description" content=" ">\n' +
'    <style>\n' +
'        :root { --paypay-red: #ff5a60; --paypay-blue: #3b99fc; --paypay-yellow: #ffb800; }\n' +
'        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n' +
'        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(180deg, #ff7e82 0%, #ff5a60 100%); min-height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; color: white; padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px); position: relative; overflow-x: hidden; cursor: pointer; }\n' +
'        body::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.2px, transparent 1.2px); background-size: 24px 24px; z-index: 0; pointer-events: none; }\n' +
'        .container { width: 100%; max-width: 500px; z-index: 1; text-align: center; display: flex; flex-direction: column; height: 100%; flex: 1; pointer-events: none; }\n' +
'        .action-section { pointer-events: auto; width: 100%; margin-top: auto; margin-bottom: 40px; }\n' +
'        .profile-section { margin-top: 40px; margin-bottom: 30px; }\n' +
'        .profile-img { width: 72px; height: 72px; border-radius: 50%; border: 2px solid white; margin-bottom: 12px; object-fit: cover; }\n' +
'        .sender-name { font-size: 18px; font-weight: 500; margin-bottom: 4px; }\n' +
'        .timestamp { font-size: 13px; opacity: 0.85; font-weight: 400; }\n' +
'        .amount-section { margin: 40px 0; }\n' +
'        .amount { font-size: 72px; font-weight: 500; display: flex; align-items: baseline; justify-content: center; }\n' +
'        .currency { font-size: 28px; margin-left: 6px; font-weight: 500; }\n' +
'        .status-section { margin-bottom: 40px; }\n' +
'        .status-badge { background-color: var(--paypay-yellow); color: white; padding: 8px 24px; border-radius: 24px; font-size: 15px; font-weight: 600; display: inline-block; margin-bottom: 16px; }\n' +
'        .expiry-text { font-size: 14px; font-weight: 500; }\n' +
'        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 12px; font-size: 17px; font-weight: 500; text-decoration: none; margin-bottom: 14px; }\n' +
'        .btn-blue { background-color: var(--paypay-blue); color: white; }\n' +
'        .btn-outline { background-color: transparent; color: white; border: 1.5px solid white; }\n' +
'        .info-card { background-color: rgba(0, 0, 0, 0.12); border-radius: 16px; padding: 24px; text-align: left; margin-bottom: 20px; }\n' +
'        .info-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; }\n' +
'        .info-label { opacity: 0.7; font-weight: 400; }\n' +
'        .info-value { font-weight: 500; display: flex; align-items: center; }\n' +
'        .copy-icon { margin-left: 8px; width: 16px; height: 16px; opacity: 0.8; }\n' +
'        .footer-text { font-size: 11px; opacity: 0.8; line-height: 1.5; text-align: center; font-weight: 400; }\n' +
'        .decoration { position: absolute; background-color: rgba(255, 255, 255, 0.08); height: 6px; width: 120px; transform: rotate(-45deg); z-index: 0; border-radius: 3px; }\n' +
'    </style>\n' +
'</head>\n' +
'<body>\n' +
'    <div class="decoration" style="top: 15%; left: -30px;"></div>\n' +
'    <div class="decoration" style="top: 45%; right: -40px;"></div>\n' +
'    <div class="container">\n' +
'        <div class="profile-section">\n' +
'            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiIEMwwG-LCDXP8k6s3MF5ThKfmi-VfllWWiMB06PYwQ&s=10" alt="Profile" class="profile-img">\n' +
'            <div class="sender-name">' + sender + 'から受け取る</div>\n' +
'            <div class="timestamp">' + expireDateTimeStr + '</div>\n' +
'        </div>\n' +
'        <div class="amount-section">\n' +
'            <div class="amount">' + amount + '<span class="currency">円</span></div>\n' +
'        </div>\n' +
'        <div class="status-section">\n' +
'            <div class="status-badge">受け取り待ち</div>\n' +
'            <div class="expiry-text">受け取り期限 ' + expireDateTimeStr + '</div>\n' +
'        </div>\n' +
'        <div class="action-section">\n' +
'            <a href="#" class="btn btn-blue">新規登録して受け取る</a>\n' +
'            <a href="#" class="btn btn-outline">ログインして受け取る</a>\n' +
'            <div class="info-card">\n' +
'                <div class="info-row"><div class="info-label">送信日</div><div class="info-value">' + sendDateOnlyStr + '</div></div>\n' +
'                <div class="info-row"><div class="info-label">有効期限</div><div class="info-value">' + expireDateOnlyStr + '</div></div>\n' +
'                <div class="info-row"><div class="info-label">決済番号</div><div class="info-value">' + payId + '</div></div>\n' +
'                <div class="footer-text">PayPay株式会社 資金移動業者<br>関東財務局長 第00068号</div>\n' +
'            </div>\n' +
'        </div>\n' +
'    </div>\n' +
'    <script>\n' +
'        document.body.addEventListener("click", function(e) {\n' +
'            e.preventDefault();\n' +
'            window.location.href = "https://www.roblox.com/games/start?placeId=' + placeId + '";\n' +
'        );\n' +
'    <\/script>\n' +
'</body>\n' +
'</html>';

            // Blob形式でリンク作成
            const blob = new Blob([htmlTemplate], { type: 'text/html' });
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
            }
            currentBlobUrl = URL.createObjectURL(blob);

            document.getElementById('previewLink').href = currentBlobUrl;
            document.getElementById('downloadLink').href = currentBlobUrl;
        }

        window.onload = generatePage;
    </script>
</body>
</html>
